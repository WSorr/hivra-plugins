name: build-plugins

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  candidate-a:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.93.0
        with:
          targets: wasm32-unknown-unknown

      - name: Build canonical candidate A
        run: ./scripts/build_all_plugins.sh

      - name: Upload canonical candidate A
        uses: actions/upload-artifact@v4
        with:
          name: plugin-zips-a
          path: dist/plugins/*.zip
          if-no-files-found: error

  candidate-b:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.93.0
        with:
          targets: wasm32-unknown-unknown

      - name: Build canonical candidate B
        run: ./scripts/build_all_plugins.sh

      - name: Upload canonical candidate B
        uses: actions/upload-artifact@v4
        with:
          name: plugin-zips-b
          path: dist/plugins/*.zip
          if-no-files-found: error

  build:
    needs: [candidate-a, candidate-b]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.93.0
        with:
          targets: wasm32-unknown-unknown

      - name: Download canonical candidate A
        uses: actions/download-artifact@v4
        with:
          name: plugin-zips-a
          path: dist/candidate-a

      - name: Download canonical candidate B
        uses: actions/download-artifact@v4
        with:
          name: plugin-zips-b
          path: dist/candidate-b

      - name: Require identical canonical candidates
        run: diff -rq dist/candidate-a dist/candidate-b

      - name: Review source and canonical artifacts
        run: |
          python3 scripts/validate_plugins.py
          python3 scripts/validate_catalog.py --self-test --dist-dir dist/candidate-a
          cargo test --workspace --locked

      - name: Upload verified plugin artifacts
        uses: actions/upload-artifact@v4
        with:
          name: plugin-zips
          path: dist/candidate-a/*.zip
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download verified plugin artifacts
        uses: actions/download-artifact@v4
        with:
          name: plugin-zips
          path: dist/plugins

      - name: Publish tag release assets
        uses: softprops/action-gh-release@v2
        with:
          files: dist/plugins/*.zip
          generate_release_notes: true
